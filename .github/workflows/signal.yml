name: Signal Check (every 4h)

on:
  schedule:
    - cron: "5 0,4,8,12,16,20 * * *"
  workflow_dispatch:

jobs:
  # ── Per-symbol signal detection ──────────────────────────────────────────
  signal:
    name: ${{ matrix.symbol }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        symbol: [XRPUSDT, BTCUSDT, SOLUSDT, AVAXUSDT]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check signal — ${{ matrix.symbol }}
        id: signal
        run: |
          set +e
          python scripts/signal_check.py \
            --symbol "${{ matrix.symbol }}" \
            --bars 500 \
            --json > signal_${{ matrix.symbol }}.json
          EXIT=$?

          # Ensure we always have a valid JSON file even on crash
          if ! python -c "import json; json.load(open('signal_${{ matrix.symbol }}.json'))" 2>/dev/null; then
            echo '{"symbol":"${{ matrix.symbol }}","signal":"NONE","error":"script_crash"}' \
              > signal_${{ matrix.symbol }}.json
          fi

          cat signal_${{ matrix.symbol }}.json
          SIGNAL=$(python -c "import json; print(json.load(open('signal_${{ matrix.symbol }}.json')).get('signal','NONE'))")
          echo "signal=$SIGNAL" >> "$GITHUB_OUTPUT"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Write job summary
        if: always()
        run: |
          SYMBOL="${{ matrix.symbol }}"
          SIGNAL="${{ steps.signal.outputs.signal }}"
          if   [ "$SIGNAL" = "BREAKOUT" ]; then ICON="🚨"
          elif [ "$SIGNAL" = "ARMED" ];    then ICON="⚡"
          else ICON="—"; fi

          echo "## ${ICON} ${SYMBOL} — ${SIGNAL:-NO OUTPUT}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Bar close:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "signal_${SYMBOL}.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signal JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-${{ matrix.symbol }}-${{ github.run_id }}
          path: signal_${{ matrix.symbol }}.json
          retention-days: 7

  # ── Paper trading engine (runs after all signal jobs) ────────────────────
  paper-trade:
    name: Paper Trading
    runs-on: ubuntu-latest
    needs: signal
    if: always()
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Always fetch latest commit so paper_trades.json is up to date
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest state
        run: git pull --rebase origin main

      - name: Download all signal JSONs
        uses: actions/download-artifact@v4
        with:
          pattern: signal-*-${{ github.run_id }}
          merge-multiple: true

      - name: Run paper trading engine
        run: |
          python scripts/paper_trading.py \
            --signals signal_XRPUSDT.json signal_BTCUSDT.json \
                      signal_SOLUSDT.json signal_AVAXUSDT.json
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet paper_trades.json; then
            echo "No changes to commit."
          else
            git pull --rebase origin main
            git add paper_trades.json
            git commit -m "chore: paper trades update [skip ci]"
            git push origin main
          fi

      - name: Write paper trading summary
        if: always()
        run: |
          echo "## 📊 Paper Trading State" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat paper_trades.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── Failure alert — fires only when something broke ──────────────────────
  alert-on-failure:
    name: Alert on Failure
    runs-on: ubuntu-latest
    needs: [signal, paper-trade]
    if: failure()

    steps:
      - name: Send Telegram failure alert
        run: |
          MSG="⚠️ *Signal workflow failed*%0ARun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}%0ATime: $(date -u '+%Y-%m-%d %H:%M UTC')"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown" || true
